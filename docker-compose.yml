# The production stack, built from source - for development machines.
#
# The Raspberry Pi does NOT use this file: it runs deploy/compose.yaml, which
# pulls the images CI built. Do not run `docker compose up` here on the Pi -
# the project name is the same and this would replace production with a local
# build. See DEPLOYMENT.md.
#
# Nothing here publishes a database port. Development needs one, so it lives in
# docker-compose.dev.yml and is opted into explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
#
# That file is never loaded implicitly - it is not named `override`, so a plain
# `docker compose up` on the Pi cannot pick it up by accident.
services:
  db:
    image: postgres:17-alpine # multi-arch: works on amd64 (dev) and arm64 (Pi)
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-health_tracker}
    # No `ports`. In production nothing outside the compose network needs to
    # reach PostgreSQL: `app` and `migrate` resolve it by service name. See
    # docker-compose.dev.yml for the development port.
    volumes:
      - db_data:/var/lib/postgresql/data
    # Sized for a 384 MB container on a 2 GB Raspberry Pi. The defaults
    # (128 MB of shared buffers, 100 connections) assume a server; the app's
    # pool opens at most 5 connections, and the rest is headroom for the
    # migrate job, backups and an occasional psql.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health} -d ${POSTGRES_DB:-health_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies pending migrations, then exits. The `builder` target
  # holds only the Prisma CLI, the schema and the migrations.
  migrate:
    build:
      context: .
      target: builder
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-health}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-health_tracker}
    command: node node_modules/prisma/build/index.js migrate deploy

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Inside the compose network the database is reached by service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-health}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-health_tracker}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      # Must be the origin users actually type - on the Pi the LAN address,
      # e.g. http://192.168.1.50:3000. No default: a silent fallback to
      # localhost would reject every sign-in as cross-origin.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
    # The only service published beyond the host. LAN only for now.
    ports:
      - "3000:3000"
    # The image caps the Node heap at 320 MB (NODE_OPTIONS in the Dockerfile),
    # leaving the rest of this limit for buffers and native memory. The image
    # also carries its own HEALTHCHECK (GET /login).
    mem_limit: 512m

volumes:
  db_data:
