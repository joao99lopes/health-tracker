# Builds the arm64 images for the Raspberry Pi so it never has to run
# `next build` itself. The Pi only pulls and runs them
# (see ~/docker/health-tracker/compose.yaml on the Pi).
name: Build arm64 images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-arm64
  cancel-in-progress: true

jobs:
  build:
    # Native arm64 runner: no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image (runner stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/health-tracker:latest
            ghcr.io/${{ github.repository_owner }}/health-tracker:${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: Migrate image (builder stage, has the Prisma CLI)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/health-tracker:migrate
            ghcr.io/${{ github.repository_owner }}/health-tracker:migrate-${{ github.sha }}
          cache-from: type=gha,scope=runner
