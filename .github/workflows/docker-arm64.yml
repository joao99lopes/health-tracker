# Builds the arm64 images for the Raspberry Pi so it never has to run
# `next build` itself. The Pi only pulls and runs them
# (see deploy/compose.yaml).
#
# Order matters: nothing is pushed until lint, tests and an end-to-end smoke
# test of both images pass, and `:migrate` is pushed before `:latest`. An app
# image must never be published without the migrations it expects.
name: Build arm64 images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Queue rather than cancel: cancelling between the two pushes would leave
# `:latest` and `:migrate` from different commits.
concurrency:
  group: docker-arm64
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/health-tracker

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: check
    # Native arm64 runner: no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images are built and loaded locally first; pushing happens only
      # after the smoke test.
      - name: Migrate image (builder target)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: builder
          platforms: linux/arm64
          load: true
          tags: |
            ${{ env.IMAGE }}:migrate
            ${{ env.IMAGE }}:migrate-${{ github.sha }}
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

      - name: App image (runner target)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runner
          platforms: linux/arm64
          load: true
          # Shown on the profile page and set as the OCI revision label.
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: Smoke test
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: bash scripts/smoke-test.sh "$IMAGE:${{ github.sha }}" "$IMAGE:migrate-${{ github.sha }}"

      - name: Image sizes
        run: docker image ls "$IMAGE"

      - name: Push (migrate first)
        run: |
          docker push "$IMAGE:migrate-${{ github.sha }}"
          docker push "$IMAGE:migrate"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
